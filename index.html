<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Campaign</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 18px;
      background: linear-gradient(160deg, #061b12, #103d29);
      color: #f3fff6;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    h1 {
      margin: 12px 0 22px;
      color: #a8f0b9;
      font-size: 32px;
    }
    .school {
      display: block;
      width: 180px;
      max-width: 70%;
      margin: 0 auto 20px;
      color: #d9f8e1;
      font-weight: bold;
    }
    .school img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      object-fit: cover;
    }
    .tagline {
      margin: 0 auto 28px;
      max-width: 360px;
      line-height: 1.6;
      color: #d4f5dc;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li { margin: 13px 0; }
    a {
      display: block;
      padding: 15px 18px;
      border: 2px solid #69c98a;
      border-radius: 28px;
      background: #1d7045;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      transition: .2s ease;
    }
    a:hover, a:focus {
      background: #31985d;
      border-color: #b1f2c0;
      transform: translateY(-2px);
    }
    .note {
      margin-top: 28px;
      color: #a8d8b6;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>School Campaign</h1>

    <!-- Ganti foto.png dengan nama file foto/logo sekolah yang kamu upload -->
    <div class="school">
      <img src="foto.png" alt="SMKS Cyber Media"
           onerror="this.style.display='none'; this.parentElement.textContent='SMKS Cyber Media';">
    </div>

    <p class="tagline">Small action, big impact, Let's make a difference together</p>

    <ul>
      <li><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram Sekolah</a></li>
      <li><a href="GANTI_DENGAN_LINK_VIDEO" target="_blank" rel="noopener">Video School Campaign</a></li>
      <li><a href="GANTI_DENGAN_LINK_POSTER" target="_blank" rel="noopener">Poster Digital</a></li>
      <li><a href="GANTI_DENGAN_LINK_INSTAGRAM_EWASTE" target="_blank" rel="noopener">Instagram E-Waste</a></li>
    </ul>

    <p class="note">SMKS Cyber Media · School Campaign</p>
  </main>
</body>
</html>
